name: agent-lab-kingstown

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: agent_lab
      POSTGRES_PASSWORD: agent_lab_local
      POSTGRES_DB: agent_lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_lab -d agent_lab"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
